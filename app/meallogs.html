<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JaiFit — รายการ Meal Logs</title>

  <!-- Firebase v10 (ESM compat build via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, orderBy, query, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIbVVfc_dZYIQMG6hfNaPYWD2ux5LANBg",
      authDomain: "jaifit-ai-coach.firebaseapp.com",
      projectId: "jaifit-ai-coach",
      storageBucket: "jaifit-ai-coach.firebasestorage.app",
      messagingSenderId: "998331086072",
      appId: "1:998331086072:web:f1c0951c87623280a6770d"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);

    // ── Status badge config ──────────────────────────────────────────────────
    const STATUS = {
      safe:     { label: "✅ ปลอดภัย",    cls: "badge-safe"     },
      risky:    { label: "⚠️ เสี่ยง",      cls: "badge-risky"    },
      exceeded: { label: "🚨 เกินโควต้า",  cls: "badge-exceeded" },
    };

    // ── Helpers ──────────────────────────────────────────────────────────────
    function formatDate(ts) {
      if (!ts) return "—";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString("th-TH", {
        day: "numeric", month: "long", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    function renderStatusButtons(logId, currentStatus) {
      return Object.entries(STATUS).map(([value, s]) => {
        const isCurrent = value === currentStatus;
        return `<button type="button" class="status-btn ${isCurrent ? "active" : ""}"
                  data-id="${logId}" data-status="${value}" ${isCurrent ? "disabled" : ""}>${s.label}</button>`;
      }).join("");
    }

    function renderCard(docSnap) {
      const d = docSnap.data();
      const s = STATUS[d.status] ?? { label: d.status, cls: "" };
      return `
        <div class="card" data-id="${docSnap.id}">
          <div class="card-header">
            <span class="meal-title">${d.title ?? "—"}</span>
            <span class="badge ${s.cls}" data-role="status-badge">${s.label}</span>
          </div>
          <p class="desc">${d.description ?? ""}</p>
          <div class="meta">
            <span>🙍 ${d.userName ?? "?"}</span>
            <span>🍽 ${d.foodCategoryName ?? "?"}</span>
            <span>🕐 ${formatDate(d.loggedAt)}</span>
          </div>
          <div class="status-actions" data-role="status-actions">
            ${renderStatusButtons(docSnap.id, d.status)}
          </div>
          <p class="status-error" data-role="status-error"></p>
          <div class="card-footer">
            <button type="button" class="delete-btn" data-id="${docSnap.id}">🗑 ลบ</button>
          </div>
        </div>`;
    }

    // ── Load & render ────────────────────────────────────────────────────────
    async function loadLogs() {
      const container = document.getElementById("log-list");
      const counter   = document.getElementById("counter");

      try {
        const q    = query(collection(db, "mealLogs"), orderBy("loggedAt", "desc"));
        const snap = await getDocs(q);

        if (snap.empty) {
          container.innerHTML = "<p class='empty'>ยังไม่มีข้อมูล Meal Log</p>";
          return;
        }

        counter.textContent = `พบทั้งหมด ${snap.size} รายการ`;
        container.innerHTML = snap.docs.map(renderCard).join("");
      } catch (err) {
        container.innerHTML = `<p class="error">❌ โหลดข้อมูลล้มเหลว: ${err.message}</p>`;
        console.error(err);
      }
    }

    // ── Add meal log form ───────────────────────────────────────────────────
    async function loadFoodCategoryOptions() {
      const select = document.getElementById("food-category");
      const snap = await getDocs(collection(db, "foodCategories"));
      select.innerHTML = '<option value="">— เลือกหมวดอาหาร —</option>' +
        snap.docs.map(d => {
          const c = d.data();
          return `<option value="${d.id}" data-name="${c.name ?? ""}">${c.name ?? d.id}</option>`;
        }).join("");
    }

    async function loadUserOptions() {
      const select = document.getElementById("user");
      const snap = await getDocs(collection(db, "users"));
      select.innerHTML = '<option value="">— เลือกผู้ใช้ —</option>' +
        snap.docs.map(d => {
          const u = d.data();
          return `<option value="${d.id}" data-name="${u.name ?? ""}">${u.name ?? d.id}</option>`;
        }).join("");
    }

    function toggleForm(show) {
      document.getElementById("add-form-section").style.display = show ? "block" : "none";
      document.getElementById("log-list").style.display = show ? "none" : "block";
      document.getElementById("counter").style.display = show ? "none" : "block";
      document.getElementById("form-error").textContent = "";
    }

    async function handleAddSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById("form-error");
      errorEl.textContent = "";

      const title = form.title.value.trim();
      const description = form.description.value.trim();
      const categorySelect = form.foodCategory;
      const userSelect = form.user;
      const foodCategoryId = categorySelect.value;
      const userId = userSelect.value;

      if (!title || !foodCategoryId || !userId) {
        errorEl.textContent = "กรุณากรอกชื่อรายการ และเลือกหมวดอาหาร/ผู้ใช้ให้ครบ";
        return;
      }

      const foodCategoryName = categorySelect.selectedOptions[0].dataset.name;
      const userName = userSelect.selectedOptions[0].dataset.name;

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        await addDoc(collection(db, "mealLogs"), {
          title,
          description,
          loggedAt: Timestamp.now(),
          status: "safe",
          userId,
          userName,
          foodCategoryId,
          foodCategoryName,
        });

        form.reset();
        toggleForm(false);
        await loadLogs();
      } catch (err) {
        errorEl.textContent = `❌ บันทึกล้มเหลว: ${err.message}`;
        console.error(err);
      } finally {
        submitBtn.disabled = false;
      }
    }

    // ── Change status (inline, per card) ────────────────────────────────────
    async function handleStatusClick(e) {
      const btn = e.target.closest(".status-btn");
      if (!btn) return;

      const logId = btn.dataset.id;
      const newStatus = btn.dataset.status;
      const card = btn.closest(".card");
      const errorEl = card.querySelector('[data-role="status-error"]');
      const actionsEl = card.querySelector('[data-role="status-actions"]');
      errorEl.textContent = "";
      actionsEl.querySelectorAll(".status-btn").forEach(b => b.disabled = true);

      try {
        await updateDoc(doc(db, "mealLogs", logId), { status: newStatus });

        const s = STATUS[newStatus] ?? { label: newStatus, cls: "" };
        const badgeEl = card.querySelector('[data-role="status-badge"]');
        badgeEl.textContent = s.label;
        badgeEl.className = `badge ${s.cls}`;
        actionsEl.innerHTML = renderStatusButtons(logId, newStatus);
      } catch (err) {
        errorEl.textContent = `❌ เปลี่ยนสถานะล้มเหลว: ${err.message}`;
        console.error(err);
        actionsEl.querySelectorAll(".status-btn").forEach(b => b.disabled = b.classList.contains("active"));
      }
    }

    // ── Delete a meal log ────────────────────────────────────────────────────
    async function handleDeleteClick(e) {
      const btn = e.target.closest(".delete-btn");
      if (!btn) return;

      const logId = btn.dataset.id;
      const card = btn.closest(".card");
      const title = card.querySelector(".meal-title")?.textContent ?? "รายการนี้";

      const confirmed = window.confirm(`ลบ "${title}" ใช่หรือไม่? การลบนี้ไม่สามารถย้อนกลับได้`);
      if (!confirmed) return;

      const errorEl = card.querySelector('[data-role="status-error"]');
      btn.disabled = true;

      try {
        await deleteDoc(doc(db, "mealLogs", logId));
        card.remove();

        const counter = document.getElementById("counter");
        const remaining = document.querySelectorAll("#log-list .card").length;
        counter.textContent = remaining > 0 ? `พบทั้งหมด ${remaining} รายการ` : "";
        if (remaining === 0) {
          document.getElementById("log-list").innerHTML = "<p class='empty'>ยังไม่มีข้อมูล Meal Log</p>";
        }
      } catch (err) {
        errorEl.textContent = `❌ ลบล้มเหลว: ${err.message}`;
        console.error(err);
        btn.disabled = false;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadLogs();
      loadFoodCategoryOptions();
      loadUserOptions();
      document.getElementById("show-add-form").addEventListener("click", () => toggleForm(true));
      document.getElementById("cancel-add-form").addEventListener("click", () => toggleForm(false));
      document.getElementById("add-form").addEventListener("submit", handleAddSubmit);
      document.getElementById("log-list").addEventListener("click", handleStatusClick);
      document.getElementById("log-list").addEventListener("click", handleDeleteClick);
    });
  </script>

  <style>
    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Sarabun", "Noto Sans Thai", sans-serif;
      background: #f4f6fb;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: #fff;
      padding: 20px 24px 16px;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.5px; }
    header p  { font-size: 0.875rem; opacity: 0.85; margin-top: 2px; }

    /* ── Layout ───────────────────────────────────────────────────── */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    #counter {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 16px;
    }

    /* ── Card ─────────────────────────────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      border-left: 4px solid #d1fae5;
      transition: transform .15s;
    }
    .card:hover { transform: translateY(-2px); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .meal-title {
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.4;
      flex: 1;
    }

    .desc {
      font-size: 0.875rem;
      color: #475569;
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.8rem;
      color: #64748b;
    }

    /* ── Badges ───────────────────────────────────────────────────── */
    .badge {
      white-space: nowrap;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge-safe     { background: #dcfce7; color: #15803d; }
    .badge-risky    { background: #fef9c3; color: #92400e; }
    .badge-exceeded { background: #fee2e2; color: #b91c1c; }

    /* ── Status change buttons ────────────────────────────────────── */
    .status-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
    }
    .status-btn {
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #475569;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .status-btn:hover:not(:disabled) { background: #f1f5f9; }
    .status-btn.active {
      background: #1e293b;
      color: #fff;
      border-color: #1e293b;
      cursor: default;
    }
    .status-btn:disabled { opacity: 0.9; }
    .status-error { color: #b91c1c; font-size: 0.78rem; margin-top: 6px; }

    /* ── Delete button ────────────────────────────────────────────── */
    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }
    .delete-btn {
      border: 1px solid #fecaca;
      background: #fff;
      color: #b91c1c;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .delete-btn:hover:not(:disabled) { background: #fef2f2; }
    .delete-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Add form ─────────────────────────────────────────────────── */
    #show-add-form {
      display: block;
      width: 100%;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }
    #show-add-form:hover { background: #15803d; }

    #add-form-section {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    #add-form-section h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: #15803d;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-actions { display: flex; gap: 10px; margin-top: 14px; }
    .form-actions button {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save { background: #16a34a; color: #fff; }
    .btn-save:hover { background: #15803d; }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-cancel { background: #e2e8f0; color: #334155; }
    .btn-cancel:hover { background: #cbd5e1; }
    #form-error { color: #b91c1c; font-size: 0.85rem; margin-top: 8px; }

    /* ── States ───────────────────────────────────────────────────── */
    .empty, .error {
      text-align: center;
      padding: 40px 16px;
      color: #64748b;
      font-size: 0.9rem;
    }
    .error { color: #b91c1c; }

    /* ── Spinner ──────────────────────────────────────────────────── */
    #loading {
      display: flex;
      justify-content: center;
      padding: 48px 0;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #d1fae5;
      border-top-color: #16a34a;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>🥗 JaiFit — Meal Logs</h1>
    <p>ADT-RAISE Module 2 · Week 6 · Part D</p>
  </header>

  <main>
    <button id="show-add-form" type="button">+ เพิ่มมื้ออาหาร</button>

    <section id="add-form-section" style="display:none">
      <h2>🍽 เพิ่มมื้ออาหารใหม่</h2>
      <form id="add-form">
        <div class="form-group">
          <label for="title">ชื่อรายการ</label>
          <input type="text" id="title" name="title" required />
        </div>
        <div class="form-group">
          <label for="description">รายละเอียด</label>
          <textarea id="description" name="description"></textarea>
        </div>
        <div class="form-group">
          <label for="food-category">หมวดอาหาร</label>
          <select id="food-category" name="foodCategory" required>
            <option value="">— กำลังโหลด —</option>
          </select>
        </div>
        <div class="form-group">
          <label for="user">ผู้ใช้</label>
          <select id="user" name="user" required>
            <option value="">— กำลังโหลด —</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" id="cancel-add-form" class="btn-cancel">ยกเลิก</button>
          <button type="submit" class="btn-save">บันทึก</button>
        </div>
        <p id="form-error"></p>
      </form>
    </section>

    <p id="counter">กำลังโหลดข้อมูล…</p>
    <div id="loading"><div class="spinner"></div></div>
    <div id="log-list"></div>
  </main>

  <script>
    // ซ่อน spinner หลัง DOM โหลด (Firebase module จะ replace เนื้อหาเอง)
    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        const l = document.getElementById("loading");
        if (l) l.style.display = "none";
      }, 500);
    });
  </script>
</body>
</html>
