<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JaiFit — รายการ Meal Logs</title>

  <!-- Firebase v10 (ESM compat build via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, setDoc, getDoc, doc, orderBy, where, limit, query, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIbVVfc_dZYIQMG6hfNaPYWD2ux5LANBg",
      authDomain: "jaifit-ai-coach.firebaseapp.com",
      projectId: "jaifit-ai-coach",
      storageBucket: "jaifit-ai-coach.firebasestorage.app",
      messagingSenderId: "998331086072",
      appId: "1:998331086072:web:f1c0951c87623280a6770d"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    // ── Current logged-in user's profile (set by onAuthStateChanged) ────────
    let currentProfile = null; // { uid, name, email, role }

    // ── AI status suggestion (OpenRouter) ───────────────────────────────────
    const OPENROUTER_MODEL = "google/gemini-2.5-flash-lite";
    let pendingAiStatus = null; // ตั้งเมื่อผู้ใช้กด "ใช้คำแนะนำนี้" เท่านั้น

    // ── AI behavior summary + nudge (agentic, ระดับ 2) ──────────────────────
    let pendingNudge = null; // { logId, message } ตั้งเมื่อ AI สรุปผลสำเร็จ ใช้ตอนกดยืนยันส่ง

    function getOpenRouterApiKey() {
      try {
        let key = localStorage.getItem("openrouter_api_key");
        if (!key) {
          key = window.prompt(
            "วางคีย์ OpenRouter API ของคุณ (เก็บไว้แค่ใน localStorage ของเบราว์เซอร์นี้เท่านั้น ไม่ถูกส่งไปที่อื่น):"
          );
          if (key) localStorage.setItem("openrouter_api_key", key.trim());
        }
        return key ? key.trim() : null;
      } catch (err) {
        console.error("เข้าถึง localStorage ไม่ได้:", err);
        return null;
      }
    }

    // ── Status badge config ──────────────────────────────────────────────────
    const STATUS = {
      safe:     { label: "✅ ปลอดภัย",    cls: "badge-safe"     },
      risky:    { label: "⚠️ เสี่ยง",      cls: "badge-risky"    },
      exceeded: { label: "🚨 เกินโควต้า",  cls: "badge-exceeded" },
    };

    // ── Helpers ──────────────────────────────────────────────────────────────
    function formatDate(ts) {
      if (!ts) return "—";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString("th-TH", {
        day: "numeric", month: "long", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    function renderStatusButtons(logId, currentStatus) {
      return Object.entries(STATUS).map(([value, s]) => {
        const isCurrent = value === currentStatus;
        return `<button type="button" class="status-btn ${isCurrent ? "active" : ""}"
                  data-id="${logId}" data-status="${value}" ${isCurrent ? "disabled" : ""}>${s.label}</button>`;
      }).join("");
    }

    function renderCard(docSnap) {
      const d = docSnap.data();
      const s = STATUS[d.status] ?? { label: d.status, cls: "" };
      return `
        <div class="card" data-id="${docSnap.id}">
          <div class="card-header">
            <span class="meal-title">${d.title ?? "—"}</span>
            <span class="badge ${s.cls}" data-role="status-badge">${s.label}</span>
          </div>
          <p class="desc">${d.description ?? ""}</p>
          <div class="meta">
            <span>🙍 ${d.userName ?? "?"}</span>
            <span>🍽 ${d.foodCategoryName ?? "?"}</span>
            <span>🕐 ${formatDate(d.loggedAt)}</span>
          </div>
          <div class="status-actions" data-role="status-actions">
            ${renderStatusButtons(docSnap.id, d.status)}
          </div>
          <p class="status-error" data-role="status-error"></p>
          <div class="card-footer">
            <button type="button" class="delete-btn" data-id="${docSnap.id}">🗑 ลบ</button>
          </div>
        </div>`;
    }

    // ── Load & render ────────────────────────────────────────────────────────
    async function loadLogs() {
      const container = document.getElementById("log-list");
      const counter   = document.getElementById("counter");

      try {
        const q    = query(
          collection(db, "mealLogs"),
          where("userId", "==", currentProfile.uid),
          orderBy("loggedAt", "desc")
        );
        const snap = await getDocs(q);

        if (snap.empty) {
          container.innerHTML = "<p class='empty'>ยังไม่มีข้อมูล Meal Log</p>";
          return;
        }

        counter.textContent = `พบทั้งหมด ${snap.size} รายการ`;
        container.innerHTML = snap.docs.map(renderCard).join("");
      } catch (err) {
        container.innerHTML = `<p class="error">❌ โหลดข้อมูลล้มเหลว: ${err.message}</p>`;
        console.error(err);
      }
    }

    // ── Add meal log form ───────────────────────────────────────────────────
    async function loadFoodCategoryOptions() {
      const select = document.getElementById("food-category");
      const snap = await getDocs(collection(db, "foodCategories"));
      select.innerHTML = '<option value="">— เลือกหมวดอาหาร —</option>' +
        snap.docs.map(d => {
          const c = d.data();
          return `<option value="${d.id}" data-name="${c.name ?? ""}">${c.name ?? d.id}</option>`;
        }).join("");
    }

    function toggleForm(show) {
      document.getElementById("add-form-section").style.display = show ? "block" : "none";
      document.getElementById("log-list").style.display = show ? "none" : "block";
      document.getElementById("counter").style.display = show ? "none" : "block";
      document.getElementById("form-error").textContent = "";
      document.getElementById("nudge-section").style.display = "none";
      resetAiSuggestion();
    }

    function resetAiSuggestion() {
      pendingAiStatus = null;
      document.getElementById("ai-suggestion").style.display = "none";
      document.getElementById("ai-suggest-error").textContent = "";
      document.getElementById("ai-confirmed-text").textContent = "";
    }

    async function handleAiSuggest() {
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const errorEl = document.getElementById("ai-suggest-error");
      errorEl.textContent = "";

      if (!title) {
        errorEl.textContent = "กรุณากรอกชื่อรายการก่อนให้ AI ช่วยประเมิน";
        return;
      }

      const apiKey = getOpenRouterApiKey();
      if (!apiKey) {
        errorEl.textContent = "ต้องใส่ OpenRouter API key ก่อนถึงจะใช้ฟีเจอร์นี้ได้";
        return;
      }

      const btn = document.getElementById("ai-suggest-btn");
      btn.disabled = true;
      btn.textContent = "กำลังวิเคราะห์...";
      resetAiSuggestion();

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            model: OPENROUTER_MODEL,
            response_format: { type: "json_object" },
            messages: [
              {
                role: "system",
                content: "คุณเป็นผู้ช่วยประเมินความเสี่ยงด้านอาหารสำหรับแอป JaiFit " +
                  "จากชื่อรายการและรายละเอียดมื้ออาหารที่ผู้ใช้กรอก ให้ประเมินว่าควรมีสถานะใดใน 3 ค่านี้เท่านั้น: " +
                  "\"safe\" (ปลอดภัย คาร์บ/น้ำตาลต่ำ), \"risky\" (เสี่ยง มีคาร์บ/น้ำตาลปานกลาง), " +
                  "\"exceeded\" (เกินโควต้า คาร์บ/น้ำตาลสูงมาก หรือของทอด/ขนมหวาน) " +
                  "ตอบกลับเป็น JSON เท่านั้น รูปแบบ {\"status\": \"safe|risky|exceeded\", \"reason\": \"เหตุผลสั้นๆ ภาษาไทย\"}",
              },
              {
                role: "user",
                content: `ชื่อรายการ: ${title}\nรายละเอียด: ${description || "(ไม่มี)"}`,
              },
            ],
          }),
        });

        if (!response.ok) {
          throw new Error(`OpenRouter API ตอบกลับผิดพลาด (HTTP ${response.status})`);
        }

        const data = await response.json();
        const content = data.choices?.[0]?.message?.content;
        if (!content) throw new Error("ไม่ได้รับคำตอบจาก AI");

        const parsed = JSON.parse(content);
        if (!STATUS[parsed.status]) {
          throw new Error(`AI ตอบสถานะที่ไม่รู้จัก: ${parsed.status}`);
        }

        const s = STATUS[parsed.status];
        document.getElementById("ai-suggestion-badge").textContent = s.label;
        document.getElementById("ai-suggestion-badge").className = `badge ${s.cls}`;
        document.getElementById("ai-suggestion-reason").textContent = parsed.reason || "";
        document.getElementById("ai-suggestion").dataset.status = parsed.status;
        document.getElementById("ai-suggestion").style.display = "block";
      } catch (err) {
        errorEl.textContent = `❌ ให้ AI ช่วยประเมินล้มเหลว: ${err.message}`;
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "🤖 ให้ AI ช่วยประเมิน";
      }
    }

    function handleAiConfirm() {
      const suggestionEl = document.getElementById("ai-suggestion");
      const status = suggestionEl.dataset.status;
      if (!status) return;

      pendingAiStatus = status;
      const s = STATUS[status];
      document.getElementById("ai-confirmed-text").textContent = `✅ จะบันทึกเป็น: ${s.label}`;
    }

    // ── AI behavior summary + nudge (agentic) ───────────────────────────────
    function toggleNudgeSection(show) {
      document.getElementById("nudge-section").style.display = show ? "block" : "none";
      document.getElementById("log-list").style.display = show ? "none" : "block";
      document.getElementById("counter").style.display = show ? "none" : "block";
      document.getElementById("add-form-section").style.display = "none";
      resetNudgeState();
    }

    function resetNudgeState() {
      pendingNudge = null;
      document.getElementById("nudge-loading").style.display = "none";
      document.getElementById("nudge-result").style.display = "none";
      document.getElementById("nudge-error").textContent = "";
      document.getElementById("nudge-sent-text").textContent = "";
    }

    async function fetchWithTimeout(url, options, timeoutMs) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } catch (err) {
        if (err.name === "AbortError") {
          throw new Error("การเชื่อมต่อ AI หมดเวลา (timeout) กรุณาลองใหม่อีกครั้ง");
        }
        throw err;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function handleNudgeAnalyze() {
      const errorEl = document.getElementById("nudge-error");
      const btn = document.getElementById("show-nudge-btn");
      resetNudgeState();
      errorEl.textContent = "";

      if (!currentProfile) {
        errorEl.textContent = "กรุณาเข้าสู่ระบบก่อน";
        return;
      }

      const apiKey = getOpenRouterApiKey();
      if (!apiKey) {
        errorEl.textContent = "ต้องใส่ OpenRouter API key ก่อนถึงจะใช้ฟีเจอร์นี้ได้";
        return;
      }

      document.getElementById("nudge-loading").style.display = "flex";
      btn.disabled = true;

      try {
        // ── ขั้น 1: อ่านหลายที่ — ดึง mealLogs ล่าสุด 10 รายการของผู้ใช้คนนี้ ──
        const q = query(
          collection(db, "mealLogs"),
          where("userId", "==", currentProfile.uid),
          orderBy("loggedAt", "desc"),
          limit(10)
        );
        const snap = await getDocs(q);

        if (snap.empty) {
          errorEl.textContent = "ยังไม่มีข้อมูล mealLog ให้วิเคราะห์";
          return;
        }

        const logsForPrompt = snap.docs.map(d => {
          const data = d.data();
          return `- ${formatDate(data.loggedAt)} | ${data.title ?? "—"} | หมวด: ${data.foodCategoryName ?? "?"} | สถานะ: ${data.status ?? "?"}`;
        }).join("\n");
        const latestLogId = snap.docs[0].id;

        // ── ขั้น 2: สรุปให้คนอ่าน — ส่งให้ AI วิเคราะห์แนวโน้ม ──
        const response = await fetchWithTimeout("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            model: OPENROUTER_MODEL,
            response_format: { type: "json_object" },
            messages: [
              {
                role: "system",
                content: "คุณเป็นโค้ชสุขภาพสำหรับแอป JaiFit ได้รับรายการ mealLog ล่าสุดของผู้ใช้คนหนึ่ง " +
                  "ให้วิเคราะห์แนวโน้มพฤติกรรมการกิน (เช่น เสี่ยง/เกินโควต้ากี่ครั้ง จากหมวดอาหารหรือรูปแบบอะไรบ้าง) " +
                  "แล้วร่างข้อความ nudge สั้นๆ ให้กำลังใจพร้อมคำแนะนำเชิงพฤติกรรมที่ทำได้จริง โทนเป็นมิตร ไม่ตำหนิ " +
                  "ตอบกลับเป็น JSON เท่านั้น รูปแบบ {\"summary\": \"สรุปแนวโน้มภาษาไทย\", \"nudgeMessage\": \"ข้อความ nudge ภาษาไทย\"}",
              },
              {
                role: "user",
                content: `mealLog ล่าสุด (เรียงใหม่สุดก่อน):\n${logsForPrompt}`,
              },
            ],
          }),
        }, 30000);

        if (!response.ok) {
          throw new Error(`OpenRouter API ตอบกลับผิดพลาด (HTTP ${response.status})`);
        }

        const data = await response.json();
        const content = data.choices?.[0]?.message?.content;
        if (!content) throw new Error("ไม่ได้รับคำตอบจาก AI");

        const parsed = JSON.parse(content);
        if (!parsed.summary || !parsed.nudgeMessage) {
          throw new Error("AI ตอบกลับไม่ครบ (ไม่มี summary หรือ nudgeMessage)");
        }

        // ── ขั้น 3: เขียนผลกลับให้คนเห็น (ยังไม่บันทึกจนกว่าจะกดยืนยัน) ──
        pendingNudge = { logId: latestLogId, message: parsed.nudgeMessage };
        document.getElementById("nudge-summary-text").textContent = parsed.summary;
        document.getElementById("nudge-message-text").textContent = parsed.nudgeMessage;
        document.getElementById("nudge-result").style.display = "block";
      } catch (err) {
        errorEl.textContent = `❌ วิเคราะห์ล้มเหลว: ${err.message}`;
        console.error(err);
      } finally {
        document.getElementById("nudge-loading").style.display = "none";
        btn.disabled = false;
      }
    }

    // ── ขั้น 4: จดบันทึก — เขียน nudge ลง Firestore เมื่อผู้ใช้กดยืนยันเท่านั้น ──
    async function handleNudgeConfirm() {
      if (!pendingNudge) return;
      const errorEl = document.getElementById("nudge-error");
      const confirmBtn = document.getElementById("nudge-confirm-btn");
      errorEl.textContent = "";
      confirmBtn.disabled = true;

      try {
        await addDoc(collection(db, "mealLogs", pendingNudge.logId, "nudges"), {
          message: pendingNudge.message,
          sentAt: Timestamp.now(),
          response: "",
        });
        document.getElementById("nudge-sent-text").textContent = "✅ ส่ง Nudge แล้ว";
        pendingNudge = null;
      } catch (err) {
        errorEl.textContent = `❌ ส่ง Nudge ล้มเหลว: ${err.message}`;
        console.error(err);
        confirmBtn.disabled = false;
      }
    }

    function handleNudgeCancel() {
      toggleNudgeSection(false);
    }

    async function handleAddSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById("form-error");
      errorEl.textContent = "";

      const title = form.title.value.trim();
      const description = form.description.value.trim();
      const categorySelect = form.foodCategory;
      const foodCategoryId = categorySelect.value;

      if (!title || !foodCategoryId) {
        errorEl.textContent = "กรุณากรอกชื่อรายการ และเลือกหมวดอาหารให้ครบ";
        return;
      }
      if (!currentProfile) {
        errorEl.textContent = "กรุณาเข้าสู่ระบบก่อนบันทึกมื้ออาหาร";
        return;
      }

      const foodCategoryName = categorySelect.selectedOptions[0].dataset.name;
      const userId = currentProfile.uid;
      const userName = currentProfile.name;

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        await addDoc(collection(db, "mealLogs"), {
          title,
          description,
          loggedAt: Timestamp.now(),
          status: pendingAiStatus ?? "safe",
          userId,
          userName,
          foodCategoryId,
          foodCategoryName,
        });

        form.reset();
        toggleForm(false);
        await loadLogs();
      } catch (err) {
        errorEl.textContent = `❌ บันทึกล้มเหลว: ${err.message}`;
        console.error(err);
      } finally {
        submitBtn.disabled = false;
      }
    }

    // ── Change status (inline, per card) ────────────────────────────────────
    async function handleStatusClick(e) {
      const btn = e.target.closest(".status-btn");
      if (!btn) return;

      const logId = btn.dataset.id;
      const newStatus = btn.dataset.status;
      const card = btn.closest(".card");
      const errorEl = card.querySelector('[data-role="status-error"]');
      const actionsEl = card.querySelector('[data-role="status-actions"]');
      errorEl.textContent = "";
      actionsEl.querySelectorAll(".status-btn").forEach(b => b.disabled = true);

      try {
        await updateDoc(doc(db, "mealLogs", logId), { status: newStatus });

        const s = STATUS[newStatus] ?? { label: newStatus, cls: "" };
        const badgeEl = card.querySelector('[data-role="status-badge"]');
        badgeEl.textContent = s.label;
        badgeEl.className = `badge ${s.cls}`;
        actionsEl.innerHTML = renderStatusButtons(logId, newStatus);
      } catch (err) {
        errorEl.textContent = `❌ เปลี่ยนสถานะล้มเหลว: ${err.message}`;
        console.error(err);
        actionsEl.querySelectorAll(".status-btn").forEach(b => b.disabled = b.classList.contains("active"));
      }
    }

    // ── Delete a meal log ────────────────────────────────────────────────────
    async function handleDeleteClick(e) {
      const btn = e.target.closest(".delete-btn");
      if (!btn) return;

      const logId = btn.dataset.id;
      const card = btn.closest(".card");
      const title = card.querySelector(".meal-title")?.textContent ?? "รายการนี้";

      const confirmed = window.confirm(`ลบ "${title}" ใช่หรือไม่? การลบนี้ไม่สามารถย้อนกลับได้`);
      if (!confirmed) return;

      const errorEl = card.querySelector('[data-role="status-error"]');
      btn.disabled = true;

      try {
        await deleteDoc(doc(db, "mealLogs", logId));
        card.remove();

        const counter = document.getElementById("counter");
        const remaining = document.querySelectorAll("#log-list .card").length;
        counter.textContent = remaining > 0 ? `พบทั้งหมด ${remaining} รายการ` : "";
        if (remaining === 0) {
          document.getElementById("log-list").innerHTML = "<p class='empty'>ยังไม่มีข้อมูล Meal Log</p>";
        }
      } catch (err) {
        errorEl.textContent = `❌ ลบล้มเหลว: ${err.message}`;
        console.error(err);
        btn.disabled = false;
      }
    }

    // ── Auth: signup / login / logout ───────────────────────────────────────
    function showAuthView(view) {
      document.getElementById("login-form-section").style.display = view === "login" ? "block" : "none";
      document.getElementById("signup-form-section").style.display = view === "signup" ? "block" : "none";
    }

    async function handleSignup(e) {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById("signup-error");
      errorEl.textContent = "";

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value;

      if (!name || !email || !password) {
        errorEl.textContent = "กรุณากรอกข้อมูลให้ครบ";
        return;
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", cred.user.uid), {
          name,
          email,
          role: "user",
          createdAt: Timestamp.now(),
        });
        form.reset();
        // onAuthStateChanged จะรับช่วงต่อ (โหลดโปรไฟล์ + สลับไปหน้าแอป) อัตโนมัติ
      } catch (err) {
        errorEl.textContent = `❌ สมัครสมาชิกล้มเหลว: ${err.message}`;
        console.error(err);
      } finally {
        submitBtn.disabled = false;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById("login-error");
      errorEl.textContent = "";

      const email = form.email.value.trim();
      const password = form.password.value;

      if (!email || !password) {
        errorEl.textContent = "กรุณากรอกอีเมลและรหัสผ่าน";
        return;
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        form.reset();
      } catch (err) {
        errorEl.textContent = `❌ เข้าสู่ระบบล้มเหลว: ${err.message}`;
        console.error(err);
      } finally {
        submitBtn.disabled = false;
      }
    }

    function handleLogout() {
      signOut(auth);
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        let name = user.email;
        let role = "user";
        try {
          const profileSnap = await getDoc(doc(db, "users", user.uid));
          if (profileSnap.exists()) {
            name = profileSnap.data().name ?? name;
            role = profileSnap.data().role ?? role;
          }
        } catch (err) {
          console.error("โหลดโปรไฟล์ผู้ใช้ล้มเหลว:", err);
        }
        currentProfile = { uid: user.uid, name, email: user.email, role };

        document.getElementById("auth-section").style.display = "none";
        document.getElementById("app-section").style.display = "block";
        document.getElementById("user-bar").style.display = "flex";
        document.getElementById("user-bar-name").textContent = `สวัสดี, ${name}`;

        loadLogs();
        loadFoodCategoryOptions();
      } else {
        currentProfile = null;
        document.getElementById("auth-section").style.display = "block";
        document.getElementById("app-section").style.display = "none";
        document.getElementById("user-bar").style.display = "none";
        showAuthView("login");
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("show-add-form").addEventListener("click", () => toggleForm(true));
      document.getElementById("cancel-add-form").addEventListener("click", () => toggleForm(false));
      document.getElementById("add-form").addEventListener("submit", handleAddSubmit);
      document.getElementById("ai-suggest-btn").addEventListener("click", handleAiSuggest);
      document.getElementById("ai-confirm-btn").addEventListener("click", handleAiConfirm);

      document.getElementById("show-nudge-btn").addEventListener("click", () => {
        toggleNudgeSection(true);
        handleNudgeAnalyze();
      });
      document.getElementById("nudge-confirm-btn").addEventListener("click", handleNudgeConfirm);
      document.getElementById("nudge-cancel-btn").addEventListener("click", handleNudgeCancel);
      document.getElementById("nudge-close-btn").addEventListener("click", handleNudgeCancel);

      document.getElementById("log-list").addEventListener("click", handleStatusClick);
      document.getElementById("log-list").addEventListener("click", handleDeleteClick);

      document.getElementById("login-form").addEventListener("submit", handleLogin);
      document.getElementById("signup-form").addEventListener("submit", handleSignup);
      document.getElementById("show-signup").addEventListener("click", (e) => { e.preventDefault(); showAuthView("signup"); });
      document.getElementById("show-login").addEventListener("click", (e) => { e.preventDefault(); showAuthView("login"); });
      document.getElementById("logout-btn").addEventListener("click", handleLogout);
    });
  </script>

  <style>

    /* ── Badges ───────────────────────────────────────────────────── */

    /* ── Status change buttons ────────────────────────────────────── */
    .status-actions {

      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;

      background: #1e293b;
      color: #fff;
      border-color: #1e293b;
      cursor: default;
    }
    .status-btn:disabled { opacity: 0.9; }
    .status-error { color: #b91c1c; font-size: 0.78rem; margin-top: 6px; }

    /* ── Delete button ────────────────────────────────────────────── */
    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }
    .delete-btn {
      border: 1px solid #fecaca;
      background: #fff;
      color: #b91c1c;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .delete-btn:hover:not(:disabled) { background: #fef2f2; }
    .delete-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Add form ─────────────────────────────────────────────────── */
    #show-add-form {
      display: block;
      width: 100%;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;

      margin-bottom: 16px;

    #show-add-form:hover { background: #15803d; }

    #show-nudge-btn {
      display: block;
      width: 100%;
      background: #eef2ff;
      color: #4338ca;

      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;

    #show-nudge-btn:hover:not(:disabled) { background: #e0e7ff; }
    #show-nudge-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    #nudge-section {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    #nudge-section h2 {

      margin-bottom: 12px;
      color: #15803d;
    }

      padding: 8px 0 16px;
      color: #64748b;
      font-size: 0.85rem;
    }
    .small-spinner {
      width: 20px; height: 20px;

      font-size: 0.85rem;

    }
    #nudge-sent-text { color: #15803d; font-weight: 600; margin-top: 10px; font-size: 0.85rem; }

    #add-form-section {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    #add-form-section h2 {
      font-size: 1.05rem;

      color: #15803d;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #cbd5e1;

      font-size: 0.9rem;
      font-family: inherit;
    }

    #ai-suggest-btn {
      background: #eef2ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    #ai-suggest-btn:hover:not(:disabled) { background: #e0e7ff; }
    #ai-suggest-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .ai-suggestion {
      background: #f5f3ff;
      border: 1px solid #ddd6fe;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
    .ai-suggestion-reason { color: #475569; margin: 6px 0 10px; }
    #ai-confirm-btn { width: auto; padding: 6px 14px; font-size: 0.82rem; border: none; border-radius: 8px; cursor: pointer; }

      flex: 1;

      cursor: pointer;

    .btn-save:hover { background: #15803d; }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-cancel { background: #e2e8f0; color: #334155; }
    .btn-cancel:hover { background: #cbd5e1; }

    /* ── States ───────────────────────────────────────────────────── */

      border: 4px solid #d1fae5;

      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

</head>
<body>

  <header>
    <h1>🥗 JaiFit — Meal Logs</h1>
    <div id="user-bar" style="display:none">
      <span id="user-bar-name"></span>
      <button id="logout-btn" type="button">ออกจากระบบ</button>
    </div>
  </header>

  <main>
    <section id="auth-section">
      <div id="login-form-section">
        <h2>🔐 เข้าสู่ระบบ</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">อีเมล</label>
            <input type="email" id="login-email" name="email" required />
          </div>
          <div class="form-group">
            <label for="login-password">รหัสผ่าน</label>
            <input type="password" id="login-password" name="password" required />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-save">เข้าสู่ระบบ</button>
          </div>
          <p id="login-error" class="form-error-text"></p>
        </form>
        <p class="auth-switch">ยังไม่มีบัญชี? <a href="#" id="show-signup">สมัครสมาชิก</a></p>
      </div>

      <div id="signup-form-section" style="display:none">
        <h2>📝 สมัครสมาชิก</h2>
        <form id="signup-form">
          <div class="form-group">
            <label for="signup-name">ชื่อที่แสดง</label>
            <input type="text" id="signup-name" name="name" required />
          </div>
          <div class="form-group">
            <label for="signup-email">อีเมล</label>
            <input type="email" id="signup-email" name="email" required />
          </div>
          <div class="form-group">
            <label for="signup-password">รหัสผ่าน</label>
            <input type="password" id="signup-password" name="password" required minlength="6" />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-save">สมัครสมาชิก</button>
          </div>
          <p id="signup-error" class="form-error-text"></p>
        </form>
        <p class="auth-switch">มีบัญชีอยู่แล้ว? <a href="#" id="show-login">เข้าสู่ระบบ</a></p>
      </div>
    </section>

    <section id="app-section" style="display:none">
      <button id="show-add-form" type="button">+ เพิ่มมื้ออาหาร</button>
      <button id="show-nudge-btn" type="button">📊 ให้ AI สรุปพฤติกรรมการกิน</button>

      <section id="nudge-section" style="display:none">
        <h2>📊 สรุปพฤติกรรมการกินด้วย AI</h2>
        <div id="nudge-loading" class="nudge-loading" style="display:none">
          <div class="spinner small-spinner"></div>
          <span>กำลังวิเคราะห์พฤติกรรม...</span>
        </div>
        <div id="nudge-result" style="display:none">
          <p><strong>📊 สรุปแนวโน้ม:</strong></p>

          <p id="nudge-message-text" class="nudge-text nudge-message-preview"></p>
          <div class="form-actions">
            <button type="button" id="nudge-cancel-btn" class="btn-cancel">ยกเลิก</button>
            <button type="button" id="nudge-confirm-btn" class="btn-save">ส่ง Nudge นี้</button>
          </div>
          <p id="nudge-sent-text"></p>
        </div>
        <p id="nudge-error" class="form-error-text"></p>
        <div class="form-actions">
          <button type="button" id="nudge-close-btn" class="btn-cancel">ปิด</button>
        </div>
      </section>

      <section id="add-form-section" style="display:none">
        <h2>🍽 เพิ่มมื้ออาหารใหม่</h2>
        <form id="add-form">
          <div class="form-group">
            <label for="title">ชื่อรายการ</label>
            <input type="text" id="title" name="title" required />
          </div>
          <div class="form-group">
            <label for="description">รายละเอียด</label>
            <textarea id="description" name="description"></textarea>
          </div>

          <div class="form-group">
            <button type="button" id="ai-suggest-btn">🤖 ให้ AI ช่วยประเมิน</button>
          </div>
          <div id="ai-suggestion" class="ai-suggestion" style="display:none">
            <p>🤖 AI แนะนำ: <span id="ai-suggestion-badge" class="badge"></span></p>
            <p class="ai-suggestion-reason" id="ai-suggestion-reason"></p>
            <button type="button" id="ai-confirm-btn" class="btn-cancel">ใช้คำแนะนำนี้</button>
            <p id="ai-confirmed-text"></p>
          </div>
          <p id="ai-suggest-error" class="form-error-text"></p>

          <div class="form-group">
            <label for="food-category">หมวดอาหาร</label>
            <select id="food-category" name="foodCategory" required>
              <option value="">— กำลังโหลด —</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-add-form" class="btn-cancel">ยกเลิก</button>
            <button type="submit" class="btn-save">บันทึก</button>
          </div>
          <p id="form-error"></p>
        </form>
      </section>

      <p id="counter">กำลังโหลดข้อมูล…</p>
      <div id="loading"><div class="spinner"></div></div>
      <div id="log-list"></div>
    </section>
  </main>

  <script>
    // ซ่อน spinner หลัง DOM โหลด (Firebase module จะ replace เนื้อหาเอง)
    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        const l = document.getElementById("loading");
        if (l) l.style.display = "none";
      }, 500);
    });
  </script>
</body>
</html>
